<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>친구 찾기</title>
<link rel="stylesheet" href="/style.css" />
<script src="/js/bootstrap.js"></script>
<style>
  :root { --line: rgba(0,0,0,.14); --muted: rgba(0,0,0,.55); }
  body { background:#fff; color:#111; font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo","Noto Sans KR", system-ui, sans-serif; margin:0; }
  .wrap { max-width:520px; margin:0 auto; padding:16px; }
  .row { position:relative; display:flex; gap:8px; }
  input { flex:1; padding:12px; background:#fff; color:#111; border:1px solid var(--line); border-radius:12px; }
  button { padding:12px 16px; border:1px solid var(--line); background:#111; color:#fff; border-radius:12px; cursor:pointer; }
  .list { margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .card { display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:12px; padding:10px; background:#fafafa; }
  .avatar { width:40px; height:40px; border-radius:999px; background:#f3f3f3; object-fit:cover; }
  .name { font-weight:600; }
  .muted { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <input id="q" placeholder="닉네임이나 아이디로 검색" />
      <button id="btn">검색</button>
    </div>
    <div class="list" id="list"></div>
  </div>
<script type="module">
import { API_BASE, AUTH_HEADERS } from "/js/config.js";

const input = document.getElementById("q");
const button = document.getElementById("btn");
const list = document.getElementById("list");
let debounceTimer = null;

async function safeJson(res) {
  try { return await res.json(); } catch { return {}; }
}

function renderUsers(users = []) {
  list.innerHTML = "";
  if (!users.length) return;
  users.forEach((u) => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = `/otherprofile.html?id=${encodeURIComponent(u.id)}&username=${encodeURIComponent(u.username)}`;
    a.innerHTML = `
      <img class="avatar" src="${u.avatar_url || "/image/avatar-default.png"}" alt="">
      <div>
        <div class="name">${u.nickname || "(닉네임 없음)"}</div>
        <div class="muted">@${u.username}</div>
      </div>
    `;
    list.appendChild(a);
  });
}

async function search() {
  const q = input.value.trim();
  if (!q) {
    list.innerHTML = "";
    return;
  }
  try {
    const res = await fetch(`${API_BASE}/api/users/search?q=${encodeURIComponent(q)}`, {
      credentials: "include",
      headers: AUTH_HEADERS(),
    });
    const data = await safeJson(res);
    renderUsers(data.users || []);
  } catch (err) {
    console.error("search failed", err);
  }
}

button.addEventListener("click", search);
input.addEventListener("input", () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(search, 200); // 타이핑 도중 자동완성
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") search();
});
</script>
<script type="module" src="/js/nav.js"></script>

</body>
</html>
